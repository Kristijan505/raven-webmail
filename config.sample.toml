# port to run the server on
# @number (required)
port=8635

# use ssl
# @boolean (required)
ssl=false

# path to ssl cert
# @string (required if ssl=true)
# ssl_certificate="/path/to/ssl/cert.pem"

# path to ssl public key
# @string (required if ssl=true)
# ssl_certificate_key="/path/to/ssl/key.pem"

# secret token used to sign session cookies — MUST be a long random string.
# Generate one with: openssl rand -hex 32   (min 32 chars; changing it invalidates sessions)
# `raven create-config` fills this in automatically with a random value.
# @string (required, min 32 characters)
secret_token="CHANGE_ME"

# mongodb url
# @string (required)
mongodb_url="mongodb://localhost:27017/raven-webmail"

# wildduck api url (it could be in another server too and http or https)
# @string (required)
wildduck_api_url="http://localhost:8080"

# wildduck api token, same as in wildduck config
# @string (required)
wildduck_api_token="same as in wildduck config"

# use express compression middleware
# @boolean (optional default=false)
# set this to false if you use a reverse proxy like nginx
compression=false 

# trust proxy hops when behind a reverse proxy (example: true or 1)
# @boolean|number (optional default=false)
# trust_proxy=true

# max JSON request size accepted by /api (example "1mb", "5mb")
# @string|number (optional default="1mb")
# json_body_limit="1mb"

# express-session cookie and store settings
# @string (optional default="raven.sid")
# session_name="raven.sid"
# @boolean (optional default=false)
# session_resave=false
# @boolean (optional default=false)
# session_rolling=false
# @number (optional default=604800000, 7 days)
# session_cookie_max_age_ms=604800000
# @boolean (optional default=true)
# session_cookie_http_only=true
# @string (optional default="lax", one of "lax" | "strict" | "none")
# session_cookie_same_site="lax"
# @boolean (optional default depends on ssl=true/false)
# session_cookie_secure=true
# @string (optional)
# session_cookie_domain="mail.example.com"

# extra locales directories
# @string[] (optional)
# by removing this comment you can add custom locales
# run `raven create-locale --code "ISO-CODE"` to create a default locale file that you can edit
# directories are relative to this file
# extra_locales_dirs=["./locales"]
