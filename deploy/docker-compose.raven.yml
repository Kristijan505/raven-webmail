services:
  raven-webmail:
    image: ${RAVEN_IMAGE:-redcode/raven-webmail:hardening-lts}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RAVEN_API_HOST: ${RAVEN_API_HOST:-127.0.0.1}
      RAVEN_API_PORT: ${RAVEN_API_PORT:-8635}
      RAVEN_API_PROTO: ${RAVEN_API_PROTO:-http}
    volumes:
      - ./config.toml:/config/config.toml:ro
    ports:
      - ${RAVEN_BIND_IP:-127.0.0.1}:${RAVEN_PORT:-8635}:8635
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8635/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - raven

networks:
  raven:
    name: ${RAVEN_NETWORK:-wildduck_default}
    external: true
